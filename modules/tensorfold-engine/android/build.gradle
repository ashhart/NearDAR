plugins {
    id 'com.android.library'
    id 'expo-module-gradle-plugin'
}

group = 'expo.modules.tensorfoldengine'
version = '1.0.0'

android {
    namespace 'expo.modules.tensorfoldengine'
    compileSdk 36
    ndkVersion rootProject.ext.ndkVersion
    defaultConfig {
        versionCode 1
        versionName '1.0.0'
        minSdk 26
        externalNativeBuild {
            cmake {
                arguments "-DTF_ENGINE_ROOT=${projectDir}/../../../engine"
            }
        }
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt' }
    }
    sourceSets {
        main {
            jniLibs.srcDir "${projectDir}/../../../engine/out/android"
        }
    }
}

